<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Football Mania - network test</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#070d1f;color:#f2f6ff;font:14px/1.35 system-ui,sans-serif;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
h1{font-size:16px;margin:0 0 8px;color:#e8c766;letter-spacing:.08em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.col{flex:1 1 260px;background:#0e1730;border:1px solid #22305a;border-radius:10px;padding:10px;min-width:0}
button{font:600 13px system-ui;color:#f2f6ff;background:#1b2a55;border:1px solid #e8c766;border-radius:20px;padding:9px 14px}
button:active{background:#e8c766;color:#000}
input{font:14px system-ui;background:#070d1f;color:#f2f6ff;border:1px solid #22305a;border-radius:8px;padding:8px;width:100%}
pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-all;font:12px/1.3 ui-monospace,monospace;color:#9fb4ff;max-height:34vh;overflow:auto}
.ok{color:#4ade80}.bad{color:#ff6b8f}.room{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #22305a}
#st{font-weight:700;margin-bottom:8px;min-height:18px}
</style></head><body>
<h1>NETWORK TEST</h1>
<div id="st">Starting...</div>
<div class="row">
  <div class="col"><b>This phone</b><pre id="addr">-</pre><button id="bAddr">Refresh</button></div>
  <div class="col"><b>Host</b><br>
    <div class="row" style="margin-top:6px"><button id="bHost">Open room</button><button id="bStopHost">Close room</button></div>
    <pre id="peers">not hosting</pre></div>
</div>
<div class="row">
  <div class="col"><b>Join</b>
    <div class="row" style="margin:6px 0"><button id="bFind">Search rooms</button><button id="bScan">Scan again</button></div>
    <div id="rooms"><i>no rooms yet</i></div>
    <div class="row" style="margin-top:8px"><input id="ip" placeholder="or type host IP, e.g. 192.168.43.1"><button id="bJoinIp">Join IP</button></div>
    <button id="bLeave" style="margin-top:8px">Leave</button></div>
  <div class="col"><b>Speed test</b> (client sends 30 msgs/s, host answers)<br>
    <div class="row" style="margin-top:6px"><button id="bPing">Ping x1</button><button id="bSpam">Start 30/s</button></div>
    <pre id="rtt">-</pre></div>
</div>
<div class="col"><b>Native log</b><pre id="log"></pre></div>
<script src="localnet.js"></script>
<script>
var $=function(i){return document.getElementById(i)},role='none',peers={},spam=null,rtts=[],lost=0,rx=0,rxT=Date.now();
function st(t,bad){$('st').textContent=t;$('st').className=bad?'bad':'ok'}
function ln(s){var l=$('log');l.textContent=s+'\n'+l.textContent.slice(0,4000)}
function showAddr(){LocalNet.addresses().then(function(a){$('addr').textContent='best: '+a.best+'\nIPv4: '+a.v4.join(', ')+'\nIPv6: '+a.v6.join(', ')+'\n'+a.ifaces.map(function(i){return i.iface+' '+i.ip}).join('\n');if(!a.best)st('No network address. Turn on Hotspot or join one.',1)},function(e){st(e.message,1)})}
function drawPeers(){$('peers').textContent=role==='host'?('players connected: '+Object.keys(peers).length+'\n'+Object.keys(peers).join(', ')):'not hosting'}
function drawRooms(){var r=LocalNet.listRooms(),h=$('rooms');h.innerHTML='';if(!r.length){h.innerHTML='<i>no rooms yet</i>';return}
 r.forEach(function(x){var d=document.createElement('div');d.className='room';d.innerHTML='<span><b></b><br><small></small></span>';d.querySelector('b').textContent=x.name+' ('+x.host+')';d.querySelector('small').textContent=x.address+'  '+x.n+'/'+x.max+(x.open?'':'  closed');
 var b=document.createElement('button');b.textContent='Join';b.onclick=function(){doJoin(x.address,x.port)};d.appendChild(b);h.appendChild(d)})}
function doJoin(a,p){LocalNet.stopDiscover().catch(function(){});LocalNet.join(a,p).then(function(){role='client'},function(){})}
LocalNet.on('status',function(t){st(t)});
LocalNet.on('log',ln);
LocalNet.on('roomFound',drawRooms);LocalNet.on('roomLost',drawRooms);
LocalNet.on('peerJoined',function(e){peers[e.id]=e.address;drawPeers();LocalNet.sendTo(e.id,{t:'welcome',id:e.id});st('Player joined: '+e.id)});
LocalNet.on('peerLeft',function(e){delete peers[e.id];drawPeers();st('Player left: '+e.id+' ('+e.reason+')',1)});
LocalNet.on('disconnected',function(e){role='none';clearInterval(spam);spam=null;$('bSpam').textContent='Start 30/s';st('Disconnected: '+e.reason,1)});
LocalNet.on('message',function(from,m){
  if(m&&m.t==='ping'&&role==='host'){LocalNet.sendTo(from,{t:'pong',ts:m.ts,n:m.n},{unreliable:true});rx++;return}
  if(m&&m.t==='pong'){rtts.push(Date.now()-m.ts);if(rtts.length>60)rtts.shift();
    var s=rtts.slice().sort(function(a,b){return a-b}),avg=s.reduce(function(a,b){return a+b},0)/s.length;
    $('rtt').textContent='round trip ms  avg '+avg.toFixed(0)+'  median '+s[s.length>>1]+'  max '+s[s.length-1]+'\nsamples '+s.length;return}
  if(m&&m.t==='welcome'){st('Joined. You are '+m.id+'. Connection OK.');return}
});
$('bAddr').onclick=showAddr;
$('bHost').onclick=function(){LocalNet.host({name:'Test host',room:'Net test',maxPlayers:8}).then(function(r){role='host';peers={};drawPeers();showAddr()},function(){})};
$('bStopHost').onclick=function(){LocalNet.stopHost().then(function(){role='none';peers={};drawPeers();st('Room closed')})};
$('bFind').onclick=function(){LocalNet.discover().catch(function(){})};
$('bScan').onclick=function(){LocalNet.scanNow()};
$('bJoinIp').onclick=function(){var v=$('ip').value.trim();if(v)doJoin(v)};
$('bLeave').onclick=function(){LocalNet.leave().then(function(){role='none'})};
$('bPing').onclick=function(){LocalNet.send({t:'ping',ts:Date.now()}).catch(function(e){st(e.message,1)})};
$('bSpam').onclick=function(){if(spam){clearInterval(spam);spam=null;$('bSpam').textContent='Start 30/s';return}
  var n=0;$('bSpam').textContent='Stop';spam=setInterval(function(){LocalNet.send({t:'ping',ts:Date.now(),n:n++,pad:'x'.repeat(100)},{unreliable:true}).catch(function(){})},33)};
setInterval(function(){if(role==='host'&&rx){ln('host received '+rx+' pings in last 2s');rx=0}},2000);
LocalNet.ready().then(function(ok){
  if(!ok){st('Native network plugin NOT found. Open this page inside the Football Mania app.',1);return}
  st('Plugin found. Network ready.');showAddr();LocalNet.nativeLog().then(function(l){l.forEach(ln)})});
</script></body></html>
